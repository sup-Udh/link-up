<!DOCTYPE html>
<html>
<body style="width: 250px; font-family: sans-serif; padding: 10px;">

  <h2 style="margin-top: 0; color: #333;">Linko</h2>

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-size: 12px; margin-bottom: 5px; color: #555; font-weight: bold;">Display Name</label>
    <input type="text" id="displayName" placeholder="Enter your name..." style="width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;" />
  </div>

  <button id="start" style="width: 100%; padding: 8px; background: #2ea44f; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px;">
    Start Session
  </button>

  <div id="status" style="margin-top: 10px; font-size: 13px; color: #555;"></div>

  <script src="popup.js"></script>
</body>
</html>
