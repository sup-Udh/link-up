<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="header">
    <div class="logo-title">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6" />
          <polyline points="8 6 2 12 8 18" />
        </svg>
      </div>
      <h2>Linko</h2>
    </div>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
      <!-- Sun icon (shown in dark mode) -->
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
      <!-- Moon icon (shown in light mode) -->
      <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>
  </div>

  <!-- VIEW: Loading -->
  <div id="view-loading" class="view active">
    <div class="loader"></div>
  </div>

  <!-- VIEW: Unauthenticated -->
  <div id="view-unauth" class="view">
    <p class="description">Connect your account to start collaborative sessions.</p>
    <button id="btn-show-pairing" class="btn-primary">Enter Pairing Code</button>
  </div>

  <!-- VIEW: Pairing -->
  <div id="view-pairing" class="view">
    <label for="pairingCode">Enter Pairing Code</label>
    <input type="text" id="pairingCode" placeholder="ABCD-1234" maxlength="9" class="mb-3 text-center tracking-widest uppercase font-mono" />
    <button id="btn-verify" class="btn-primary">Verify Code</button>
    <button id="btn-cancel-pairing" class="btn-text mt-2">Cancel</button>
  </div>

  <!-- VIEW: Authenticated -->
  <div id="view-auth" class="view">
    <div class="user-profile mb-4">
      <div id="user-avatar" class="avatar"></div>
      <div class="user-info">
        <div id="user-name" class="name">Name</div>
        <div id="user-email" class="email">email@example.com</div>
      </div>
    </div>

    <div class="form-group-inline">
      <label for="requireApproval">Require Join Approval</label>
      <label class="toggle-switch">
        <input type="checkbox" id="requireApproval" />
        <span class="slider"></span>
      </label>
    </div>

    <button id="start" class="btn-primary">Start Session</button>
    
    <div class="footer-actions mt-4">
      <button id="btn-disconnect" class="btn-text text-red">Disconnect Account</button>
    </div>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
