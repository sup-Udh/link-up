server {
    listen 80;
    server_name localhost;

    # Rule 1: Send WebSocket traffic to the ws_app container
    location /socket {
        proxy_pass http://ws_app:8080; # Uses Docker's internal network name!
        
        # Essential WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Rule 2: Send all other standard web traffic to the Next.js container
    location / {
        proxy_pass http://nextjs_app:3000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}